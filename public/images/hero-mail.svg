<svg width="480" height="360" viewBox="0 0 480 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="heroGlow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="heroGlow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="envBody" x1="90" y1="80" x2="390" y2="290" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="55%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="glassCard" x1="120" y1="50" x2="360" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#F0F9FF" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="330" y1="70" x2="410" y2="165" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <filter id="softShadow" x="50" y="60" width="380" height="270" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#2563EB" flood-opacity="0.16"/>
    </filter>
    <filter id="pillShadow" x="30" y="180" width="210" height="100" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.09"/>
    </filter>
  </defs>

  <!-- Soft ambient aura -->
  <circle cx="240" cy="180" r="165" fill="url(#heroGlow1)"/>
  <circle cx="340" cy="120" r="110" fill="url(#heroGlow2)"/>

  <!-- Decorative orbit ring -->
  <ellipse cx="240" cy="195" rx="185" ry="62" stroke="#93C5FD" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 8"/>

  <!-- Main Floating Envelope Card -->
  <g filter="url(#softShadow)">
    <rect x="92" y="102" width="296" height="190" rx="28" fill="url(#envBody)"/>
    <!-- Inner glass message sheet peeking out -->
    <rect x="118" y="68" width="244" height="156" rx="20" fill="url(#glassCard)" stroke="#DBEAFE" stroke-width="1.5"/>
    <!-- Message sheet lines -->
    <rect x="144" y="94" width="84" height="10" rx="5" fill="#BFDBFE"/>
    <rect x="144" y="114" width="168" height="8" rx="4" fill="#E2E8F0"/>
    <rect x="144" y="130" width="132" height="8" rx="4" fill="#E2E8F0"/>
    <!-- OTP chip inside letter -->
    <rect x="144" y="152" width="118" height="32" rx="10" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
    <circle cx="162" cy="168" r="5" fill="#10B981"/>
    <rect x="176" y="164" width="70" height="8" rx="4" fill="#1D4ED8"/>

    <!-- Front envelope fold -->
    <path d="M92 142L224 226C233.8 232.2 246.2 232.2 256 226L388 142V264C388 279.5 375.5 292 360 292H120C104.5 292 92 279.5 92 264V142Z" fill="url(#envBody)" fill-opacity="0.94"/>
    <path d="M104 148L226 225C234.5 230.4 245.5 230.4 254 225L376 148" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Floating Security Shield Badge -->
  <g>
    <circle cx="372" cy="112" r="42" fill="#FFFFFF" fill-opacity="0.95" stroke="#E0E7FF" stroke-width="2"/>
    <path d="M372 86L394 95V112C394 126.5 384.6 138.8 372 143C359.4 138.8 350 126.5 350 112V95L372 86Z" fill="url(#shieldGrad)"/>
    <path d="M363.5 113L369.5 119L381.5 106" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Floating Live Stream Pill -->
  <g filter="url(#pillShadow)">
    <rect x="52" y="218" width="154" height="46" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <circle cx="76" cy="241" r="7" fill="#10B981" fill-opacity="0.22"/>
    <circle cx="76" cy="241" r="4" fill="#10B981"/>
    <rect x="92" y="233" width="66" height="7" rx="3.5" fill="#1E293B"/>
    <rect x="92" y="245" width="94" height="6" rx="3" fill="#94A3B8"/>
  </g>

  <!-- Sparkle accents -->
  <circle cx="88" cy="96" r="5" fill="#38BDF8"/>
  <circle cx="418" cy="228" r="6" fill="#818CF8" fill-opacity="0.7"/>
  <circle cx="394" cy="264" r="3.5" fill="#0EA5E9"/>
  <path d="M126 52L129 60L137 63L129 66L126 74L123 66L115 63L123 60L126 52Z" fill="#2563EB" fill-opacity="0.75"/>
  <path d="M416 74L418 79L423 81L418 83L416 88L414 83L409 81L414 79L416 74Z" fill="#0EA5E9"/>
</svg>
